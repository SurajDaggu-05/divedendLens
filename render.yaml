services:
  - type: web
    name: dividendlens-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dividendlens-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: dividendlens-db
    databaseName: dividendlens
    user: dividendlens_user
